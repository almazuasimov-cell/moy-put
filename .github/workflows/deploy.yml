name: Test & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      target:
        description: "Куда деплоить"
        required: true
        default: staging
        type: choice
        options: [staging, prod]

jobs:
  test:
    runs-on: [self-hosted, voice-diary]
    steps:
      - uses: actions/checkout@v4
      - name: Run tests (venv staging уже содержит все зависимости)
        run: |
          cd backend
          /opt/voice-diary-staging/venv/bin/python3 -m pytest tests/ -q

  deploy-staging:
    needs: test
    if: github.event_name == 'push' || github.event.inputs.target == 'staging'
    runs-on: [self-hosted, voice-diary]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging
        run: |
          rsync -av --delete \
            --exclude=venv --exclude=.venv --exclude=__pycache__ --exclude='*.pyc' \
            --exclude=.pytest_cache --exclude=.env --exclude=uploads --exclude=backups \
            --exclude=test.db \
            backend/ /opt/voice-diary-staging/
          sudo systemctl restart voice-diary-staging.service
          sleep 2
          sudo systemctl is-active voice-diary-staging.service
      - name: Health check
        run: |
          sleep 2
          curl -sf https://moy-way.ru:8443/health

  deploy-prod:
    needs: test
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'prod'
    runs-on: [self-hosted, voice-diary]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to prod
        run: |
          rsync -av \
            --exclude=venv --exclude=.venv --exclude=__pycache__ --exclude='*.pyc' \
            --exclude=.pytest_cache --exclude=.env --exclude=uploads --exclude=backups \
            --exclude=test.db \
            backend/ /opt/voice-diary/
          sudo systemctl restart voice-diary.service
          sleep 3
          sudo systemctl is-active voice-diary.service
      - name: Health check
        run: |
          sleep 2
          curl -sf https://moy-way.ru/health
