# Staging «Мой путь» — доступ по отдельному порту (8443), без basic auth
# (убрали: конфликтует с заголовком Authorization, который использует
# сам JWT-логин приложения). Отдельная БД (voice_diary_staging), S3
# выключен, использует те же ключи DeepSeek/OpenAI, что и прод
# (реальные вызовы ИИ стоят денег даже из staging).
server {
    listen 8443 ssl;
    server_name moy-way.ru;

    ssl_certificate /etc/letsencrypt/live/moy-way.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moy-way.ru/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
