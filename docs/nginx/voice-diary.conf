server {
    if ($host = www.moy-way.ru) {
        return 301 https://$host$request_uri;
    }
    if ($host = moy-way.ru) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name moy-way.ru www.moy-way.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name moy-way.ru www.moy-way.ru;
    ssl_certificate /etc/letsencrypt/live/moy-way.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moy-way.ru/privkey.pem;

    client_max_body_size 50M;

    # Лендинг — только для корня
    location = / {
        root /var/www/moy-way;
        try_files /index.html =404;
    }

    # APK — правильный Content-Type для Android
    location /apk/ {
        alias /opt/voice-diary/uploads/apk/;
        types { }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "inline; filename=app-release.apk";
    }

    # Auth rate-limit
    location /auth/login {
        limit_req zone=login_limit burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Register rate-limit — против массовой регистрации фейковых аккаунтов
    location /auth/register {
        limit_req zone=register_limit burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Referral apply rate-limit — против фарминга реферального бонуса
    location /referral/apply {
        limit_req zone=referral_limit burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AI-эндпоинты — дорогие (Whisper CPU / DeepSeek), rate-limit против
    # всплесков нагрузки от многих легитимных пользователей одновременно.
    location /stt/transcribe {
        limit_req zone=ai_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location /entries/process {
        limit_req zone=ai_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location /search {
        limit_req zone=ai_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location /biography/generate {
        limit_req zone=biography_limit burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Мониторинг сервера (Netdata) — за basic auth, не публично
    location /netdata/ {
        proxy_pass http://127.0.0.1:19999/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        auth_basic "Netdata Monitoring";
        auth_basic_user_file /etc/nginx/.htpasswd_netdata;
    }

    # API — всё остальное
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
